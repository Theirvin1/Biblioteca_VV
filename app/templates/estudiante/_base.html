{% extends 'shared/base.html' %}

{% block navbar %}
<nav class="navbar navbar-expand-lg navbar-dark navbar-uteq">
    <div class="container">
        <a class="navbar-brand" href="{{ url_for('estudiante.listado_catalogo') }}">Biblioteca · Estudiante</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navEstudiante">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navEstudiante">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link {% if request.endpoint in ['estudiante.listado_catalogo', 'estudiante.detalle_libro'] %}active{% endif %}"
                       href="{{ url_for('estudiante.listado_catalogo') }}">Catálogo</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if request.endpoint == 'estudiante.mis_prestamos' %}active{% endif %}"
                       href="{{ url_for('estudiante.mis_prestamos') }}">Mis préstamos</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if request.endpoint == 'estudiante.mi_perfil' %}active{% endif %}"
                       href="{{ url_for('estudiante.mi_perfil') }}">Mi perfil</a>
                </li>
            </ul>
            <span class="navbar-text me-3">{{ current_user.username }}</span>
            <a class="btn btn-outline-light btn-sm" href="{{ url_for('auth.logout') }}">Cerrar sesión</a>
        </div>
    </div>
</nav>
{% endblock %}
