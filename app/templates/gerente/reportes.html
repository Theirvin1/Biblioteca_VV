{% extends 'gerente/_base.html' %}

{% block title %}Reportes - Gerente{% endblock %}

{% block content %}
<h2 class="mb-4">Reportes</h2>

<div class="row g-3">
    {% for clave, reporte in reportes.items() %}
    <div class="col-md-4">
        <div class="card h-100 shadow-sm">
            <div class="card-body d-flex flex-column">
                <h5 class="card-title">{{ reporte.titulo }}</h5>
                <a href="{{ url_for('gerente.ver_reporte', tipo=clave) }}" class="btn btn-outline-primary btn-sm mt-auto">Ver reporte</a>
            </div>
        </div>
    </div>
    {% else %}
    <div class="col-12">
        <p class="text-muted text-center py-4">No hay reportes configurados.</p>
    </div>
    {% endfor %}
</div>
{% endblock %}
