{#
    Modal compartido para ver la portada en grande. Una sola instancia por
    pagina: se reutiliza para todas las portadas (los datos los pone
    static/js/portada_ampliada.js al hacer clic en cada imagen
    [data-accion="ver-portada"], que genera el macro portada_libro).
#}
<div class="modal fade" id="modal-portada-libro" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modal-portada-titulo">Portada del libro</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
            </div>
            <div class="modal-body text-center">
                <img id="modal-portada-imagen" src="" alt="Portada" class="portada-ampliada">
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cerrar</button>
            </div>
        </div>
    </div>
</div>
